[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-sub-dub"
description = "Download a video or playlist from the web, or take a file or folder: self-hosted transcription, translation by a local or remote LLM, timed .srt and .vtt files, optional dubbing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]
app = ["pywebview>=5", "pywin32; sys_platform == 'win32'"]   # python -m subtitles.app: the page in a window, a shortcut
dev = ["pytest", "ruff"]

[project.scripts]
subtitles = "subtitles.__main__:main"
subtitles-web = "subtitles.web.__main__:main"
dl-sub-dub-mcp = "subtitles.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "subtitles.__version__" }

[tool.setuptools.packages.find]
include = ["subtitles*"]

[tool.setuptools.package-data]
subtitles = ["config.toml", "locales/*.json", "icons/*"]
"subtitles.web" = ["static/*", "static/v2/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"          # summary of every failure, error and skip (test name and reason) at the end of the run

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "B905"]  # long lines and short names: project style; zip: lengths already guaranteed
