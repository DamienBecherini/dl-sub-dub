name: Feedback
description: Rate dl-sub-dub, say what you think of it, report a bug or suggest an idea.
title: "[Feedback] "
labels: [feedback]
# The ids and the values offered are stable: the window « Give my opinion » of the page fills this form in by its
# address (subtitles/web/static/v2/feedback.js). Rating and type are text fields, not lists: GitHub fills in only text
# fields from the address.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. **Everything is optional**: one piece of information is enough. English or French, as you prefer.
        This issue is public: write nothing about your videos or your machine that you would not publish.
        A security flaw does not belong here: report it privately from the Security tab (« Report a vulnerability »).

  - type: input
    id: rating
    attributes:
      label: Rating
      description: "Your overall note, from 1 to 5: « ★★★★★ 5/5 », « ★★★★☆ 4/5 »… (or simply 4, 4/5). Leave empty not to rate."
      placeholder: "★★★★☆ 4/5"
    validations:
      required: false

  - type: input
    id: type
    attributes:
      label: Type
      description: "« Opinion », « Bug » or « Idea »."
      placeholder: "Opinion"
    validations:
      required: false

  - type: textarea
    id: message
    attributes:
      label: Message
      description: Your opinion, the bug (what you did, what happened, what you expected) or your idea.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of dl-sub-dub (`/api/health`, or `python -c "import subtitles; print(subtitles.__version__)"`).
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: System (Windows, Linux, macOS), Python, window or browser, the kinds of the engines (local or remote).
    validations:
      required: false
